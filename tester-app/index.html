    <script>
      // Captura o evento de instalação do PWA (Chrome/Edge/Android).
      // Guarda o prompt e avisa o app (que mostra o botão "Instalar").
      (function () {
        window.aquariappInstallPrompt = null;
        var readyp = 'aquariapp-install-ready';
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.aquariappInstallPrompt = e;
          window.dispatchEvent(new Event(readyp));
        });
        window.addEventListener('appinstalled', function () {
          window.aquariappInstallPrompt = null;
          window.dispatchEvent(new Event('aquariapp-installed'));
        });
      })();
    </script>

# Render.com blueprint — AquarIApp Backend
# Suba a pasta `server/deploy-backend` num repositório Git e crie um Web Service
# a partir deste arquivo (Render lê automaticamente) OU siga o README-deploy.md.
services:
  - type: web
    name: aquariapp-ia
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: PLANTNET_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      # URL pública do front (ex.: https://aquariapp.netlify.app)
      - key: ALLOWED_ORIGINS
        value: https://aquariapp.com.br,https://www.aquariapp.com.br,https://tranquil-sable-8b2aa1.netlify.app,https://serene-selkie-310f60.netlify.app
      # URL pública deste backend (ex.: https://aquariapp-ia.onrender.com)
      - key: PUBLIC_BASE_URL
        value: https://aquariapp-ia.onrender.com
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: PAGAMENTO_WEBHOOK_URL
        value: https://aquariapp-ia.onrender.com/pagamentos/webhook
      - key: PAGAMENTO_URL_RETORNO
        value: https://aquariapp.com.br
